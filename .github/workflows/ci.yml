name: AMATYA CI / Reproducible Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Verify Environment & Configurations
        run: |
          python -c "import numpy, scipy, fastapi, uvicorn, pydantic; print('Dependencies OK')"

      - name: Run Portable Test Suite (Unit, Security, RAG, Reasoning, Simulation)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -m "not integration" -v

      - name: Run Integration & Desktop Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -m "integration" -v

